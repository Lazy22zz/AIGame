; AndroidEngine.ini — loaded ONLY for Android builds.
; Overrides DefaultEngine.ini to disable PC-only features and improve mobile performance.

[/Script/Engine.RendererSettings]

; --- Global Illumination ---
; Lumen is not supported on mobile Vulkan; fall back to no dynamic GI.
r.DynamicGlobalIlluminationMethod=0

; --- Reflections ---
; Lumen reflections off; use simple screen-space reflections or nothing.
r.ReflectionMethod=0

; --- Nanite ---
; Nanite is not supported on mobile. The engine Cube mesh has no Nanite data anyway.
r.Nanite.ProjectEnabled=False

; --- Shadows ---
; Virtual Shadow Maps are not available on mobile; use standard cascaded shadow maps.
r.Shadow.Virtual.Enable=0

; --- Anti-aliasing ---
; TAA is expensive; use MSAA x2 on mobile (fast on tile-based GPUs).
r.AntiAliasingMethod=2
r.MSAACount=2
r.TemporalAA.Upsampling=False

; --- Screen percentage (render at native resolution on mobile) ---
r.ScreenPercentage=100

; --- Disable compute-heavy post-process features ---
r.DepthOfFieldQuality=0
r.MotionBlurQuality=0
r.AmbientOcclusionMipLevelFactor=0
r.AmbientOcclusionMaxQuality=0

; --- Mobile-specific shading ---
; Forward shading is faster on tile-based mobile GPUs.
r.ForwardShading=True

; --- Disable GPU particle simulation (not needed for this game) ---
fx.AllowGPUSorting=0

[ConsoleVariables]
; Lock frame-rate to 60 fps on mobile to prevent thermal throttling.
t.MaxFPS=60
